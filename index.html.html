<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uday Mart | Premium Silk Sarees</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff8f0;
      color: #40101f;
    }

    header {
      background: #65152b;
      color: white;
      text-align: center;
      padding: 25px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      color: #f0ce82;
    }

    .hero {
      text-align: center;
      padding: 45px 15px;
      background: #f0dfcc;
    }

    .hero h2 {
      font-size: 32px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      text-align: center;
      border-radius: 12px;
      box-shadow: 0 3px 12px #00000015;
    }
    .saree {
  width: 100%;
  height: 280px;
  object-fit: cover;
  display: block;
  background: #ead6c1;
  border-radius: 8px;
}

    const sarees = [
  {
    id: 1,
    name: "Royal Kanjivaram Silk",
    price: 2499,
    image: "images/kanjivaram.jpg"
  },
  {
    id: 2,
    name: "Banarasi Silk Saree",
    price: 1999,
    image: "images/banarasi.jpg"
  },
  {
    id: 3,
    name: "Bridal Silk Saree",
    price: 2999,
    image: "images/bridal.jpg"
  },
  {
    id: 4,
    name: "Elegant Festive Saree",
    price: 1799,
    image: "images/festive.jpg"
  }
];
    }

    .price {
      font-size: 22px;
      font-weight: bold;
    }

    button {
      border: none;
      padding: 12px 18px;
      background: #65152b;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #8c2945;
    }

    #cart {
      margin: 20px;
      padding: 25px;
      background: white;
      border-radius: 10px;
    }

    .cart-row {
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    footer {
      background: #65152b;
      color: white;
      padding: 22px;
      text-align: center;
    }
  </style>
</head>

<body>
  <header>
    <h1>Uday Mart</h1>
    <p>Premium Silk Sarees</p>
  </header>

  <section class="hero">
    <h2>Elegance in Every Saree</h2>
    <p>Discover beautiful sarees for your special occasions.</p>
    <button onclick="document.getElementById('collection').scrollIntoView()">
      Shop Now
    </button>
  </section>

  <h2 style="text-align:center" id="collection">
    Our Saree Collection
  </h2>

  <section class="products" id="products"></section>

  <section id="cart">
    <h2>🛒 My Cart (<span id="count">0</span>)</h2>
    <div id="cart-items">Your cart is empty.</div>
    <h3>Total: ₹<span id="total">0</span></h3>
    <button onclick="orderWhatsApp()">Order on WhatsApp</button>
    <button onclick="clearCart()">Clear Cart</button>
  </section>

  <footer>
    <h3>Uday Mart</h3>
    <p>Premium Silk Sarees | Thank you for visiting!</p>
  </footer>

  <script>
    const WHATSAPP_NUMBER = "918008325525";

    const sarees = [
  {
    id: 1,
    name: "Royal Kanjivaram Silk",
    price: 2499,
    image: "images/kanjivaram.jpg"
  },
  {
    id: 2,
    name: "Banarasi Silk Saree",
    price: 1999,
    image: "images/banarasi.jpg"
  },
  {
    id: 3,
    name: "Bridal Silk Saree",
    price: 2999,
    image: "images/bridal.jpg"
  },
  {
    id: 4,
    name: "Elegant Festive Saree",
    price: 1799,
    image: "images/festive.jpg"
  }
];

    let cart = [];

    const products = document.getElementById("products");

    sarees.forEach(saree => {
      const card = document.createElement("div");
      card.className = "card";

     const image = document.createElement("img");
image.className = "saree";
image.src = saree.image;
image.alt = saree.name;

      const name = document.createElement("h3");
      name.textContent = saree.name;

      const price = document.createElement("p");
      price.className = "price";
      price.textContent = "₹" + saree.price.toLocaleString("en-IN");

      const button = document.createElement("button");
      button.textContent = "Add to Cart";
      button.onclick = () => addToCart(saree.id);

      card.append(image, name, price, button);
      products.appendChild(card);
    });

    function addToCart(id) {
      const item = cart.find(p => p.id === id);

      if (item) {
        item.quantity++;
      } else {
        const saree = sarees.find(p => p.id === id);
        cart.push({ ...saree, quantity: 1 });
      }

      displayCart();
    }

    function changeQuantity(id, amount) {
      const item = cart.find(p => p.id === id);
      if (!item) return;

      item.quantity += amount;

      if (item.quantity <= 0) {
        cart = cart.filter(p => p.id !== id);
      }

      displayCart();
    }

    function removeItem(id) {
      cart = cart.filter(p => p.id !== id);
      displayCart();
    }

    function displayCart() {
      const container = document.getElementById("cart-items");
      container.replaceChildren();

      let total = 0;
      let count = 0;

      if (cart.length === 0) {
        container.textContent = "Your cart is empty.";
      }

      cart.forEach(item => {
        total += item.price * item.quantity;
        count += item.quantity;

        const row = document.createElement("div");
        row.className = "cart-row";

        const text = document.createElement("p");
        text.textContent =
          `${item.name} — ₹${item.price} × ${item.quantity}`;

        const minus = document.createElement("button");
        minus.textContent = "−";
        minus.onclick = () => changeQuantity(item.id, -1);

        const plus = document.createElement("button");
        plus.textContent = "+";
        plus.onclick = () => changeQuantity(item.id, 1);

        const remove = document.createElement("button");
        remove.textContent = "Remove";
        remove.onclick = () => removeItem(item.id);

        row.append(text, minus, plus, remove);
        container.appendChild(row);
      });

      document.getElementById("total").textContent =
        total.toLocaleString("en-IN");
      document.getElementById("count").textContent = count;
    }

    function clearCart() {
      cart = [];
      displayCart();
    }

    function orderWhatsApp() {
      if (cart.length === 0) {
        alert("Please add a saree to your cart first.");
        return;
      }

      if (WHATSAPP_NUMBER.includes("X")) {
        alert("Please add your WhatsApp number in the code first.");
        return;
      }

      let total = 0;
      const lines = cart.map(item => {
        total += item.price * item.quantity;
        return `${item.name} x ${item.quantity} = ₹${item.price * item.quantity}`;
      });

      const message =
        "Hello Uday Mart! I want to order:\n\n" +
        lines.join("\n") +
        `\n\nTotal: ₹${total}`;

      const url = "https://wa.me/" + WHATSAPP_NUMBER +
        "?text=" + encodeURIComponent(message);

      window.open(url, "_blank");
    }

    displayCart();
  </script>
</body>
</html>
